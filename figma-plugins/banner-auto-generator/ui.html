<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;font:12px Inter,sans-serif;color:var(--figma-color-text);background:var(--figma-color-bg)}
h2{font-size:16px;margin:0 0 6px}.sub{color:var(--figma-color-text-secondary);line-height:1.5;margin-bottom:18px}
.drop{height:190px;border:1px dashed var(--figma-color-border);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:var(--figma-color-bg-secondary)}
.drop.on{border-color:#e17055;background:rgba(225,112,85,.08)}input{display:none}.file{margin-top:12px;font-weight:700;word-break:break-all}
button{width:100%;padding:11px;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:14px;background:#e17055;color:#210d08}button:disabled{opacity:.4}.status{margin-top:12px;color:var(--figma-color-text-secondary);line-height:1.5}
</style></head><body><h2>NEXUS 배너 자동 생성</h2><div class="sub">배너 크리에이터에서 내보낸 <b>Figma 자동 생성 JSON</b>을 불러오면 8개 규격을 한 번에 만듭니다.</div>
<label class="drop" id="drop"><input id="file" type="file" accept=".json,application/json"><span>JSON을 드래그하거나<br>클릭해서 선택</span></label><div class="file" id="name"></div>
<button id="run" disabled>사이즈별 배너 생성</button><div class="status" id="status">1180×750 · 1200×630 · 1352×860 · 600×340 · 620×640 · 375×230 · 266×280 · 72×40</div>
<script>let data=null;const file=document.getElementById('file'),drop=document.getElementById('drop'),run=document.getElementById('run'),status=document.getElementById('status'),nameEl=document.getElementById('name');
async function load(f){try{data=JSON.parse(await f.text());if(!data.layers||!data.outputs)throw Error('배너 생성 파일 형식이 아닙니다.');nameEl.textContent=f.name;run.disabled=false;status.textContent=`${data.outputs.length}개 규격 준비됨`;}catch(e){data=null;run.disabled=true;status.textContent=e.message;}}
file.onchange=e=>load(e.target.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');load(e.dataTransfer.files[0])};
run.onclick=()=>{run.disabled=true;status.textContent='Figma 레이어 생성 중…';parent.postMessage({pluginMessage:{type:'generate',data}},'*')};
onmessage=e=>{const m=e.data.pluginMessage;if(m?.type==='done'){status.textContent=`완료: ${m.count}개 배너 생성`;run.disabled=false}if(m?.type==='error'){status.textContent=`오류: ${m.message}`;run.disabled=false}};</script></body></html>
